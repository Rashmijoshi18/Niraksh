name: Bug report
description: Report a reproducible problem in Niraksh-Guardian
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Niraksh-Guardian. Do not include real patient data, medical images, credentials, or API keys.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic data and provide the smallest reproducible example.
      placeholder: |
        1. Go to ...
        2. Enter synthetic data ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, OS, service, and commit/version. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact credentials and personal or health information before sharing.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I used synthetic data and removed sensitive information.
          required: true
